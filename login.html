const U="https://tpvoqfurhqacdcvjnxjv.supabase.co",K="sb_publishable_4JCkMsGZ8bXXYPI1vwj8nw_7MIPVAPE",msg=document.querySelector("#message");let sb;function say(s,e=false){msg.textContent=s;msg.classList.toggle("error",e)}function next(){let n=new URLSearchParams(location.search).get("next");return n&&n.startsWith("/")&&!n.startsWith("//")?n:"/"}function load(){let s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";s.onload=async()=>{sb=window.supabase.createClient(U,K);let {data}=await sb.auth.getSession();if(data.session)location.replace(next())};s.onerror=()=>say("Could not load authentication library. Check internet connection.",true);document.head.appendChild(s)}document.querySelector("#form").addEventListener("submit",async e=>{e.preventDefault();if(!sb){say("Please wait for page to load.",true);return}let email=document.querySelector("#email").value.trim(),password=document.querySelector("#password").value;try{say("Signing in…");let {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;if(data.session)location.replace(next())}catch(e){say(e.message||"Could not sign in.",true)}});document.querySelector("#signup").addEventListener("click",async()=>{if(!sb){say("Please wait for page to load.",true);return}let email=document.querySelector("#email").value.trim(),password=document.querySelector("#password").value;if(!email||password.length<6){say("Enter a valid email and password of at least 6 characters.",true);return}try{say("Creating account…");let {data,error}=await sb.auth.signUp({email,password});if(error)throw error;if(data.session)location.replace(next());else say("Account created. Check your email for the confirmation link, then sign in.")}catch(e){say(e.message||"Could not create account.",true)}});load();
